<script>
    const SPREADSHEET_ID = '1-tDw5FVxGm59QORzgkZle2dYpQfF5hTxtcb8H30DX3c';
    let cashflowChartInstance = null;
    let rabChartInstance = null;

    async function fetchSheetData(sheetName) {
        const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Gagal mengambil data sheet: ${sheetName}`);
            const csvText = await response.text();
            return parseCSV(csvText);
        } catch (error) {
            console.error(`Error fetching sheet [${sheetName}]:`, error);
            return null;
        }
    }

    function parseCSV(text) {
        const lines = text.split('\n');
        return lines.map(line => {
            const regex = /(?:^|,)(?:"([^"]*)"|([^,]*))/g;
            const row = [];
            let match;
            while ((match = regex.exec(line)) !== null) {
                let val = match[1] !== undefined ? match[1] : match[2];
                row.push(val ? val.trim() : '');
            }
            return row;
        });
    }

    function formatRp(num) {
        const parsed = parseFloat(num);
        if (isNaN(parsed)) return 'Rp 0';
        return 'Rp ' + Math.round(parsed).toLocaleString('id-ID');
    }

    function cleanNumber(str) {
        if (!str) return 0;
        const cleaned = str.toString().replace(/[^0-9.-]+/g, '');
        return parseFloat(cleaned) || 0;
    }

    async function fetchRealtimeData() {
        const refreshIcon = document.getElementById('refreshIcon');
        const lastUpdated = document.getElementById('lastUpdated');
        if (refreshIcon) refreshIcon.classList.add('fa-spin');

        const dataBukuKas = await fetchSheetData('Buku Kas IPL');
        const dataOps = await fetchSheetData('Laporan Operasional');
        const dataRAB = await fetchSheetData('RAB IPL');

        let totalIn = 0, totalOut = 0, saldoKas = 0, totalRAB = 0;

        if (dataBukuKas) totalIn = renderBukuKasTable(dataBukuKas);
        if (dataOps) totalOut = renderOperasionalTable(dataOps);
        if (dataRAB) totalRAB = renderRABTable(dataRAB);

        saldoKas = totalIn - totalOut;
        const sisaRAB = totalRAB - totalOut;

        // Update Kartu KPI Utama
        document.getElementById('kpiTotalPemasukan').innerText = formatRp(totalIn);
        document.getElementById('kpiTotalPengeluaran').innerText = formatRp(totalOut);
        document.getElementById('kpiSaldoKas').innerText = formatRp(saldoKas);
        document.getElementById('kpiSisaRAB').innerText = formatRp(sisaRAB > 0 ? sisaRAB : 0);

        if (refreshIcon) refreshIcon.classList.remove('fa-spin');
        
        const now = new Date();
        if (lastUpdated) {
            lastUpdated.innerText = `(${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')})`;
        }

        showToast('Data berhasil disinkronisasi real-time dari Google Sheets!');
    }

    function renderBukuKasTable(rows) {
        const tbody = document.querySelector('#tablePenerimaan tbody');
        if (!tbody) return 0;
        let html = '';
        let totalInSum = 0;

        rows.forEach((row, index) => {
            if (index < 1 || !row[0]) return;
            const bulan = row[0];
            const ops = cleanNumber(row[1]);
            const sampah = cleanNumber(row[2]);
            const totalIn = cleanNumber(row[3]);
            const totalOut = cleanNumber(row[4]);
            const saldo = cleanNumber(row[5]);

            if (bulan.toUpperCase().includes('TOTAL')) return;
            totalInSum += totalIn;

            html += `
                <tr class="hover:bg-slate-50">
                    <td class="py-3 px-4 font-bold text-slate-900">${bulan}</td>
                    <td class="py-3 px-4 text-right">${ops > 0 ? formatRp(ops) : '-'}</td>
                    <td class="py-3 px-4 text-right">${sampah > 0 ? formatRp(sampah) : '-'}</td>
                    <td class="py-3 px-4 text-right font-bold text-emerald-700">${formatRp(totalIn)}</td>
                    <td class="py-3 px-4 text-right text-rose-600 font-semibold">${formatRp(totalOut)}</td>
                    <td class="py-3 px-4 text-right font-bold text-slate-900">${formatRp(saldo)}</td>
                </tr>
            `;
        });
        tbody.innerHTML = html || '<tr><td colspan="6" class="text-center py-4 text-slate-400">Tidak ada data</td></tr>';
        return totalInSum;
    }

    function renderOperasionalTable(rows) {
        const tbody = document.querySelector('#tableOps tbody');
        if (!tbody) return 0;
        let html = '';
        let totalOutSum = 0;

        rows.forEach((row, index) => {
            if (index < 1 || !row[0]) return;
            const trxNo = row[0];
            const tgl = row[1] || '-';
            const coa = row[2] || '';
            const ket = row[3] || '-';
            const debit = cleanNumber(row[4]);
            const kredit = cleanNumber(row[5]);
            const saldo = cleanNumber(row[6]);

            if (trxNo.toUpperCase().includes('TOTAL')) return;
            totalOutSum += kredit;

            html += `
                <tr class="hover:bg-slate-50">
                    <td class="py-3 px-4 font-mono font-bold text-slate-500">${trxNo}</td>
                    <td class="py-3 px-4">${tgl}</td>
                    <td class="py-3 px-4"><span class="bg-sky-100 text-sky-800 text-[11px] font-bold px-2 py-0.5 rounded-full">${coa}</span></td>
                    <td class="py-3 px-4 font-medium text-slate-900">${ket}</td>
                    <td class="py-3 px-4 text-right font-bold text-emerald-700">${debit > 0 ? formatRp(debit) : '-'}</td>
                    <td class="py-3 px-4 text-right font-bold text-rose-600">${kredit > 0 ? formatRp(kredit) : '-'}</td>
                    <td class="py-3 px-4 text-right font-bold text-slate-900">${saldo > 0 ? formatRp(saldo) : '-'}</td>
                </tr>
            `;
        });
        tbody.innerHTML = html || '<tr><td colspan="7" class="text-center py-4 text-slate-400">Tidak ada data</td></tr>';
        return totalOutSum;
    }

    function renderRABTable(rows) {
        const tbody = document.querySelector('#tableRAB tbody');
        if (!tbody) return 0;
        let html = '';
        let totalRABSum = 0;

        rows.forEach((row, index) => {
            if (index < 1 || !row[0]) return;
            const no = row[0];
            const kategori = row[1] || '';
            const uraian = row[2] || '';
            const vol = row[3] || '';
            const satuan = row[4] || '';
            const harga = cleanNumber(row[5]);
            const action = row[6] || '';
            const total = cleanNumber(row[7]);
            const ket = row[8] || '';

            if (!no || no.toUpperCase().includes('TOTAL')) return;
            totalRABSum += total;

            html += `
                <tr class="hover:bg-slate-50">
                    <td class="py-3 px-4 font-bold text-slate-400">${no}</td>
                    <td class="py-3 px-4 font-semibold text-slate-800">${kategori}</td>
                    <td class="py-3 px-4 text-slate-900">${uraian}</td>
                    <td class="py-3 px-4 text-center">${vol}</td>
                    <td class="py-3 px-4">${satuan}</td>
                    <td class="py-3 px-4 text-right">${formatRp(harga)}</td>
                    <td class="py-3 px-4 text-center"><span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2 py-0.5 rounded-full">${action}</span></td>
                    <td class="py-3 px-4 text-right font-bold text-emerald-700">${formatRp(total)}</td>
                    <td class="py-3 px-4 text-xs text-slate-500">${ket}</td>
                </tr>
            `;
        });
        tbody.innerHTML = html || '<tr><td colspan="9" class="text-center py-4 text-slate-400">Tidak ada data</td></tr>';
        return totalRABSum;
    }

    function showToast(msg) {
        const toast = document.getElementById('toastNotification');
        if(toast) {
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 4000);
        }
    }

    window.addEventListener('DOMContentLoaded', () => { fetchRealtimeData(); });
</script>
